name: Windows MSI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sign:
        description: "Submit unsigned MSI to SignPath (requires SignPath approval)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  msi:
    name: Build MSI (windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Ensure WiX Toolset
        shell: pwsh
        run: |
          function Add-WixToPath {
            $wixBins = Get-ChildItem -Path @(
              "${env:ProgramFiles(x86)}\WiX Toolset*\bin",
              "${env:ProgramFiles}\WiX Toolset*\bin"
            ) -Directory -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            foreach ($bin in $wixBins) {
              Write-Host "Adding WiX bin: $bin"
              echo "$bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              $env:Path = "$bin;$env:PATH"
            }
          }

          Add-WixToPath
          if (-not ((Get-Command candle -ErrorAction SilentlyContinue) -and (Get-Command light -ErrorAction SilentlyContinue))) {
            Write-Host "WiX not found; installing via Chocolatey..."
            choco install wixtoolset -y --no-progress
            Add-WixToPath
          }

          if (-not ((Get-Command candle -ErrorAction SilentlyContinue) -and (Get-Command light -ErrorAction SilentlyContinue))) {
            throw "candle/light still not on PATH after WiX setup"
          }
          candle -? | Select-Object -First 1
          light -? | Select-Object -First 1

      - name: Verify tools
        shell: pwsh
        run: |
          rustc -vV
          cargo -V
          candle -?
          light -?

      - name: Install cargo-wix
        shell: pwsh
        run: cargo install cargo-wix --locked

      - name: Read package version
        id: meta
        shell: pwsh
        run: |
          $m = Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $m) { throw "Could not read version from Cargo.toml" }
          $version = $m.Matches.Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Package version: $version"

      - name: Resolve code signing backend
        id: signing
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
          DISPATCH_SIGN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sign || 'false' }}
        run: |
          $isTag = $env:GITHUB_REF -like 'refs/tags/v*'
          $wantSignPath = $isTag -or ($env:DISPATCH_SIGN -eq 'true')
          $hasSignPath = -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN) -and
                         -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID)
          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_BASE64) -and
                    -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PASSWORD)

          if ($wantSignPath -and $hasSignPath) {
            "backend=signpath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Signing backend: SignPath (OSS / Foundation certificate)"
            return
          }

          if ($hasPfx) {
            $pfx = Join-Path $env:RUNNER_TEMP "wslc-codesign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
            "backend=pfx" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "CODESIGN_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Signing backend: local PFX (signtool)"
            return
          }

          if ($isTag) {
            throw @"
          Tag releases must be Authenticode-signed.
          Preferred (free for OSS): SignPath Foundation — set
            secrets.SIGNPATH_API_TOKEN
            vars.SIGNPATH_ORGANIZATION_ID
          and create project/signing policy + artifact config (see README).
          Alternative: WINDOWS_CODESIGN_PFX_BASE64 + WINDOWS_CODESIGN_PASSWORD.
          "@
          }

          "backend=none" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "No signing backend configured; producing unsigned build."

      - name: Build release binary
        shell: pwsh
        run: |
          if (-not (Test-Path "wix\main.wxs")) {
            throw "Missing wix\main.wxs (desktop shortcuts + product icon must be committed)"
          }
          if (-not (Test-Path "wix\Product.ico")) {
            throw "Missing wix\Product.ico"
          }
          cargo build --release

      - name: Sign application executable (PFX)
        if: steps.signing.outputs.backend == 'pfx'
        shell: pwsh
        env:
          CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
          WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL }}
        run: |
          ./scripts/sign-windows.ps1 -Path "target\release\wslc-desktop.exe"

      - name: Build MSI (from current release binary)
        shell: pwsh
        run: cargo wix --nocapture --no-build

      - name: Sign MSI (PFX)
        if: steps.signing.outputs.backend == 'pfx'
        shell: pwsh
        env:
          CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
          WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL }}
        run: |
          $msi = Get-ChildItem "target\wix\*.msi" | Select-Object -First 1
          if (-not $msi) { throw "No MSI under target\wix" }
          ./scripts/sign-windows.ps1 -Path $msi.FullName

      - name: Upload unsigned MSI for SignPath
        if: steps.signing.outputs.backend == 'signpath'
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: wslc-desktop-msi-unsigned
          path: target/wix/*.msi
          if-no-files-found: error
          retention-days: 5

      - name: Submit SignPath signing request
        if: steps.signing.outputs.backend == 'signpath'
        id: signpath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'wslc-desktop' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'release' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # OSS policies require a human approver in SignPath before signing finishes.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ github.workspace }}/signed
          parameters: |
            version: ${{ toJSON(steps.meta.outputs.version) }}

      - name: Install signed MSI from SignPath
        if: steps.signing.outputs.backend == 'signpath'
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path "signed" -Recurse -Filter "*.msi" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $signed) {
            throw "SignPath completed but no .msi found under signed/"
          }
          New-Item -ItemType Directory -Force -Path "target\wix" | Out-Null
          Get-ChildItem "target\wix\*.msi" -ErrorAction SilentlyContinue | Remove-Item -Force
          $dest = Join-Path "target\wix" $signed.Name
          Copy-Item -LiteralPath $signed.FullName -Destination $dest -Force
          Write-Host "Installed signed MSI: $dest"
          if ('${{ steps.signpath.outputs.signing-request-web-url }}') {
            Write-Host "SignPath request: ${{ steps.signpath.outputs.signing-request-web-url }}"
          }

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: wslc-desktop-msi
          path: target/wix/*.msi
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/wix/*.msi
          generate_release_notes: true
          # Allow re-tagging the same version (e.g. rebuild v0.1.2) to replace MSI assets.
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove PFX from runner
        if: always() && steps.signing.outputs.backend == 'pfx'
        shell: pwsh
        run: |
          if ($env:CODESIGN_PFX -and (Test-Path -LiteralPath $env:CODESIGN_PFX)) {
            Remove-Item -LiteralPath $env:CODESIGN_PFX -Force
          }
