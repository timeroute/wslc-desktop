[package]
name = "wslc-desktop"
version = "0.1.2"
edition = "2024"
description = "Lightweight desktop manager for Windows WSL Containers (WSLc)"
license = "Apache-2.0"
readme = "README.md"
keywords = ["wslc", "wsl", "containers", "gpui", "desktop"]
categories = ["gui", "development-tools"]
repository = "https://github.com/timeroute/wslc-desktop"
homepage = "https://timeroute.github.io/wslc-desktop-website/"
authors = ["WSLc Desktop Contributors"]

[package.metadata.wix]
# Used by `cargo wix` on Windows to produce target/wix/*.msi
name = "WSLc Desktop"
product-name = "WSLc Desktop"
manufacturer = "WSLc Desktop"
license = false
eula = false
product-icon = "wix/Product.ico"
upgrade-guid = "31263ED9-28F7-4608-AF04-A8CAE4591EB0"

[dependencies]
anyhow = "1"
gpui-kit = "0.7.1"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
sys-locale = "0.3"
# GitHub release check (About) + Windows NuGet SDK fetch.
ureq = { version = "2.12", default-features = true, features = ["json"] }

# Official WSL Containers SDK bindings (`wslcsdk.dll`). Windows host only.
# zip: extract matching Microsoft.WSL.Containers native DLL at runtime.
[target.'cfg(windows)'.dependencies]
# Own fork of wslc-rs (OpenContainer / Logs / named volumes / extra SDK exports).
# Bump `rev` after pushing patches to https://github.com/timeroute/wslc-rs .
# Prefer git over vendor so desktop tracks the fork tip without copying the tree.
wslc = { git = "https://github.com/timeroute/wslc-rs", rev = "9fbcd72f6967f79d0dc805648120eaec77364a2e" }
zip = { version = "2", default-features = false, features = ["deflate"] }
gpui-tray = { version = "0.1", default-features = false, features = ["gpui-kit", "menu-state"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
